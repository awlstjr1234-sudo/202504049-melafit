<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Fit | 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="grain"></div>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon">🥬</span><span>Meal Fit</span></a>
    <nav class="nav">
      <a class="active" href="login.html">로그인/회원가입</a>
      <a href="search.html">레시피 검색</a>
      <a href="recommend.html">메뉴추천</a>
      <a href="ingredients.html">재료관리</a>
      <a href="settings.html">설정</a>
    </nav>
  </header>

  <main class="page">
    <section class="panel" style="max-width:620px; margin:0 auto;">
      <p class="eyebrow">로그인/회원가입</p>
      <h1 style="font-size:2.5rem;">Meal Fit 로그인</h1>

      <div class="auth-tabs" style="margin-bottom:14px;">
        <button class="chip active" id="showLoginBtn" type="button">로그인</button>
        <button class="chip" id="showSignupBtn" type="button">회원가입</button>
      </div>

      <!-- 로그인 폼 -->
      <form class="form-grid" id="loginForm">
        <div>
          <label for="loginId">아이디</label>
          <input id="loginId" type="text" placeholder="아이디 입력" required autocomplete="username" />
        </div>
        <div>
          <label for="loginPassword">비밀번호</label>
          <input id="loginPassword" type="password" placeholder="비밀번호 입력" required autocomplete="current-password" />
        </div>
        <button class="btn primary full" type="submit">로그인</button>
      </form>

      <!-- 회원가입 폼 (이메일 없음) -->
      <form class="form-grid" id="signupForm" style="display:none;">
        <div>
          <label for="signupId">아이디</label>
          <input id="signupId" type="text" placeholder="4자 이상" required autocomplete="username" />
        </div>
        <div>
          <label for="signupPassword">비밀번호</label>
          <input id="signupPassword" type="password" placeholder="4자 이상" required autocomplete="new-password" />
        </div>
        <div>
          <label for="signupPasswordConfirm">비밀번호 확인</label>
          <input id="signupPasswordConfirm" type="password" placeholder="비밀번호 재입력" required autocomplete="new-password" />
        </div>
        <button class="btn primary full" type="submit">회원가입</button>
      </form>

      <!-- 알림 -->
      <div class="notice" id="authNotice" style="display:none; margin-top:12px;"></div>

      <!-- 로그인 상태 표시 -->
      <div id="authStatus" style="margin-top:14px;"></div>

      <!-- SNS 로그인 -->
      <p style="text-align:center; margin:20px 0 8px; color:#5e6657;">SNS 계정으로 로그인</p>
      <div class="socials">
        <button class="social kakao" type="button" data-provider="kakao" title="카카오로 로그인">
          <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png" alt="카카오" width="22" height="22"
            onerror="this.style.display='none';this.parentElement.innerHTML='K'" />
        </button>
        <button class="social naver" type="button" data-provider="naver" title="네이버로 로그인">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M13.5 12.6 8.3 4H4v16h6.5V11.4L15.7 20H20V4h-6.5z"/></svg>
        </button>
        <button class="social google" type="button" data-provider="google" title="구글로 로그인">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        </button>
      </div>
      <div class="social-labels">
        <span>카카오</span>
        <span>네이버</span>
        <span>구글</span>
      </div>

      <!-- 로그아웃 (로그인 상태에서만 표시) -->
      <div style="text-align:center; margin-top:14px;">
        <button class="btn ghost" id="logoutBtn" type="button" style="display:none;">로그아웃</button>
      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
